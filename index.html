<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Chat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg: #1a1a1a;
    --surface: #242424;
    --surface2: #2e2e2e;
    --accent: #d4a574;
    --text: #e8e8e8;
    --text-dim: #888;
    --text-dark: #555;
    --user-bubble: #333;
    --radius: 8px;
  }

  html, body {
    width: 240px;
    height: 282px;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    line-height: 1.3;
  }

  /* ===== SCREENS ===== */
  .screen {
    display: none;
    width: 240px;
    height: 282px;
    flex-direction: column;
    position: absolute;
    top: 0;
    left: 0;
  }
  .screen.active {
    display: flex;
  }

  /* ===== HEADER ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--surface2);
    min-height: 28px;
    flex-shrink: 0;
  }
  .header-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .header-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 14px;
    padding: 2px 4px;
    cursor: pointer;
  }
  .header-btn:active {
    color: var(--text);
  }

  /* ===== MODEL INDICATOR ===== */
  .model-indicator {
    font-size: 8px;
    padding: 1px 5px;
    border-radius: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
    background: var(--accent);
    color: #000;
  }

  /* ===== CHAT SCREEN ===== */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .chat-messages::-webkit-scrollbar {
    width: 2px;
  }
  .chat-messages::-webkit-scrollbar-thumb {
    background: var(--surface2);
    border-radius: 2px;
  }

  .msg {
    margin-bottom: 6px;
    max-width: 95%;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    margin-left: auto;
  }
  .msg-bubble {
    padding: 5px 7px;
    border-radius: var(--radius);
    font-size: 9px;
    line-height: 1.35;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg.user .msg-bubble {
    background: var(--user-bubble);
    border-bottom-right-radius: 2px;
  }
  .msg.assistant .msg-bubble {
    background: var(--surface);
    border-bottom-left-radius: 2px;
    border-left: 2px solid var(--accent);
  }

  .msg-label {
    font-size: 7px;
    color: var(--text-dark);
    margin-bottom: 1px;
    padding: 0 2px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .msg.user .msg-label {
    text-align: right;
  }

  .typing-indicator {
    display: inline-flex;
    gap: 3px;
    padding: 6px 10px;
  }
  .typing-dot {
    width: 4px;
    height: 4px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: typingBounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-4px); }
  }

  /* ===== INTERCOM PANEL ===== */
  .intercom {
    flex-shrink: 0;
    background: linear-gradient(180deg, #2a2a2a 0%, #1c1c1c 100%);
    border-top: 1px solid #3a3a3a;
    padding: 5px 6px 5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .intercom-grille {
    width: 100%;
    height: 6px;
    background-image: radial-gradient(circle, #4a4a4a 0.8px, transparent 1.2px);
    background-size: 4px 4px;
    opacity: 0.75;
  }
  .mic-big {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, #f0c79a 0%, #d4a574 40%, #8a6539 100%);
    border: 2px solid #2a2a2a;
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,0.35),
      inset 0 -3px 5px rgba(0,0,0,0.45),
      0 2px 5px rgba(0,0,0,0.6),
      0 0 0 2px #1a1a1a,
      0 0 0 3px #4a3a24;
    color: #2a1a0a;
    font-family: inherit;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 1.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s;
    padding: 0;
    margin: 2px 0 0;
  }
  .mic-big:active {
    transform: scale(0.94);
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,0.5),
      0 1px 2px rgba(0,0,0,0.6),
      0 0 0 2px #1a1a1a,
      0 0 0 3px #4a3a24;
  }
  .mic-big.recording {
    background: radial-gradient(circle at 32% 30%, #ff8080 0%, #d63030 40%, #7a1010 100%);
    color: #fff;
    animation: recordPulse 1.1s infinite;
  }
  @keyframes recordPulse {
    0%, 100% {
      box-shadow:
        inset 0 2px 3px rgba(255,255,255,0.35),
        inset 0 -3px 5px rgba(0,0,0,0.45),
        0 2px 5px rgba(0,0,0,0.6),
        0 0 0 2px #1a1a1a,
        0 0 0 3px #7a1010,
        0 0 8px rgba(255,60,60,0.55);
    }
    50% {
      box-shadow:
        inset 0 2px 3px rgba(255,255,255,0.35),
        inset 0 -3px 5px rgba(0,0,0,0.45),
        0 2px 5px rgba(0,0,0,0.6),
        0 0 0 2px #1a1a1a,
        0 0 0 3px #7a1010,
        0 0 16px rgba(255,60,60,1);
    }
  }
  .intercom-status {
    font-size: 7px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-weight: 700;
    height: 9px;
    line-height: 9px;
    text-align: center;
    min-height: 9px;
  }
  .intercom-status.recording { color: #ff6060; }
  .intercom-status.error     { color: #cc4444; }
  .intercom-status.success   { color: var(--accent); }
  .intercom-textrow {
    display: flex;
    width: 100%;
    gap: 3px;
    margin-top: 1px;
  }
  .intercom-textrow input {
    flex: 1;
    background: var(--bg);
    border: 1px solid #333;
    border-radius: 3px;
    color: var(--text);
    font-family: inherit;
    font-size: 8px;
    padding: 3px 5px;
    outline: none;
    height: 18px;
  }
  .intercom-textrow input:focus {
    border-color: var(--accent);
  }
  .intercom-textrow input:disabled {
    opacity: 0.4;
  }
  .send-btn {
    background: var(--surface2);
    border: 1px solid #3a3a3a;
    color: var(--text-dim);
    font-family: inherit;
    font-weight: 700;
    font-size: 9px;
    width: 22px;
    height: 18px;
    border-radius: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .send-btn:active {
    background: var(--accent);
    color: #000;
  }
  .send-btn:disabled {
    opacity: 0.3;
  }

  /* ===== SETTINGS SCREEN ===== */
  .settings-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .settings-scroll::-webkit-scrollbar {
    width: 2px;
  }
  .settings-scroll::-webkit-scrollbar-thumb {
    background: var(--surface2);
    border-radius: 2px;
  }

  .settings-group {
    margin-bottom: 10px;
  }
  .settings-label {
    font-size: 7px;
    color: var(--text-dark);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
    font-weight: 700;
  }
  .settings-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--surface2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: inherit;
    font-size: 9px;
    padding: 6px;
    outline: none;
  }
  .settings-input:focus {
    border-color: var(--accent);
  }

  .model-name-select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--surface2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: inherit;
    font-size: 9px;
    padding: 6px;
    outline: none;
    -webkit-appearance: none;
  }

  .save-btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    margin-top: 6px;
    background: var(--accent);
    color: #000;
  }
  .save-btn:active {
    opacity: 0.7;
  }

  .clear-btn {
    width: 100%;
    padding: 8px;
    border: 1px solid #aa3333;
    border-radius: var(--radius);
    background: transparent;
    color: #aa3333;
    font-family: inherit;
    font-size: 9px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  .clear-btn:active {
    background: #aa3333;
    color: #fff;
  }

  /* ===== SYSTEM PROMPT ===== */
  .settings-textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--surface2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: inherit;
    font-size: 9px;
    padding: 6px;
    outline: none;
    resize: none;
    height: 40px;
  }
  .settings-textarea:focus {
    border-color: var(--accent);
  }
</style>
</head>
<body>

<!-- ===== SETTINGS SCREEN ===== -->
<div id="settingsScreen" class="screen">
  <div class="header">
    <button class="header-btn" onclick="showChat()" title="Zurück">◂</button>
    <span class="header-title">SETTINGS</span>
    <span style="width:20px"></span>
  </div>
  <div class="settings-scroll" id="settingsScroll">

    <div class="settings-group">
      <div class="settings-label">Modell</div>
      <select class="model-name-select" id="modelSelect"></select>
    </div>

    <div class="settings-group">
      <div class="settings-label">System Prompt (optional)</div>
      <textarea class="settings-textarea" id="systemPrompt" placeholder="z.B. Du bist ein hilfreicher Assistent..."></textarea>
    </div>

    <button class="save-btn" id="saveBtn" onclick="saveSettings()">💾 SPEICHERN</button>
    <button class="clear-btn" onclick="clearHistory()">🗑 Chat löschen</button>
  </div>
</div>

<!-- ===== CHAT SCREEN ===== -->
<div id="chatScreen" class="screen active">
  <div class="header">
    <button class="header-btn" onclick="showSettings()" title="Settings">⚙</button>
    <span class="header-title">INTERCOM</span>
    <span class="model-indicator" id="chatModelBadge">Claude</span>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="intercom">
    <div class="intercom-grille"></div>
    <button class="mic-big" id="micBtn" onclick="toggleRecording()" title="Tap to talk">TALK</button>
    <div class="intercom-status" id="statusBar">BEREIT</div>
    <div class="intercom-textrow">
      <input type="text" id="chatInput" placeholder="Text-Fallback" autocomplete="off">
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">▶</button>
    </div>
  </div>
</div>

<script>
  // ===== STATE =====
  // The API key no longer lives in state — it's held server-side by the
  // Vercel Edge Function in api/chat.js (ANTHROPIC_API_KEY env var).
  let state = {
    model: 'claude-sonnet-4-6',
    systemPrompt: '',
    messages: []
  };

  const STORAGE_KEY = 'r1_ai_chat';

  const MODELS = [
    { id: 'claude-haiku-4-5-20251001', name: 'Haiku 4.5' },
    { id: 'claude-sonnet-4-6',          name: 'Sonnet 4.6' },
    { id: 'claude-opus-4-6',            name: 'Opus 4.6' }
  ];

  // ===== STORAGE =====
  // Prefer window.creationStorage.plain on the R1 (survives Creation updates),
  // fall back to localStorage for regular browser testing.
  function hasCreationStorage() {
    return typeof window !== 'undefined'
      && window.creationStorage
      && window.creationStorage.plain;
  }

  async function loadState() {
    try {
      let raw = null;
      if (hasCreationStorage()) {
        const stored = await window.creationStorage.plain.getItem(STORAGE_KEY);
        if (stored) {
          try { raw = atob(stored); } catch(e) { raw = stored; }
        }
      } else {
        raw = localStorage.getItem(STORAGE_KEY);
      }
      if (!raw) return;

      const parsed = JSON.parse(raw);

      // Strip legacy fields: multi-provider, client-side API keys,
      // setup flags — nothing of that lives client-side anymore.
      delete parsed.anthropicKey;
      delete parsed.openaiKey;
      delete parsed.apiKey;
      delete parsed.provider;
      delete parsed.setupDone;

      // Strip legacy per-message provider tag
      if (Array.isArray(parsed.messages)) {
        parsed.messages = parsed.messages.map(m => ({
          role: m.role,
          content: m.content
        }));
      }

      // Coerce old/unknown model ids to default
      if (parsed.model && !MODELS.find(m => m.id === parsed.model)) {
        parsed.model = 'claude-sonnet-4-6';
      }

      state = { ...state, ...parsed };
    } catch(e) {}
  }

  async function saveState() {
    try {
      const data = JSON.stringify(state);
      if (hasCreationStorage()) {
        await window.creationStorage.plain.setItem(STORAGE_KEY, btoa(data));
      } else {
        localStorage.setItem(STORAGE_KEY, data);
      }
    } catch(e) {}
  }

  // ===== NAVIGATION =====
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function showSettings() {
    showScreen('settingsScreen');
    document.getElementById('systemPrompt').value = state.systemPrompt;
    populateModelSelect();
  }

  function showChat() {
    showScreen('chatScreen');
    updateChatUI();
    renderMessages();
    scrollToBottom();
    document.getElementById('chatInput').focus();
  }

  // ===== SETTINGS =====
  function populateModelSelect() {
    const sel = document.getElementById('modelSelect');
    sel.innerHTML = '';
    MODELS.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.name;
      sel.appendChild(opt);
    });
    sel.value = state.model;
  }

  function saveSettings() {
    state.systemPrompt = document.getElementById('systemPrompt').value.trim();
    state.model = document.getElementById('modelSelect').value;
    saveState();
    showChat();
  }

  function clearHistory() {
    if (confirm('Chat-Verlauf löschen?')) {
      state.messages = [];
      saveState();
      renderMessages();
    }
  }

  // ===== CHAT UI =====
  function updateChatUI() {
    const badge = document.getElementById('chatModelBadge');
    badge.textContent = MODELS.find(m => m.id === state.model)?.name || state.model;
  }

  function renderMessages() {
    const container = document.getElementById('chatMessages');
    container.innerHTML = '';

    if (state.messages.length === 0) {
      container.innerHTML = `
        <div style="text-align:center;padding:28px 10px;color:var(--text-dark);">
          <div style="font-size:8px;line-height:1.5;letter-spacing:0.5px;">
            TALK drücken und sprechen,<br>Chef.
          </div>
        </div>`;
      return;
    }

    state.messages.forEach(msg => {
      const div = document.createElement('div');
      div.className = 'msg ' + msg.role;

      const label = document.createElement('div');
      label.className = 'msg-label';
      label.textContent = msg.role === 'user' ? 'CHEF' : '◈ MRS. L';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = msg.content;

      div.appendChild(label);
      div.appendChild(bubble);
      container.appendChild(div);
    });

    scrollToBottom();
  }

  function scrollToBottom() {
    const container = document.getElementById('chatMessages');
    container.scrollTop = container.scrollHeight;
  }

  // Intercom status line. Passing sticky:true prevents the auto-reset,
  // which we use for RECORDING and TRANSCRIBING. Everything else auto-
  // resets back to BEREIT after a few seconds.
  let statusResetTimer = null;
  function setStatus(text, opts = {}) {
    const { isError = false, sticky = false, recording = false } = opts;
    const bar = document.getElementById('statusBar');
    if (statusResetTimer) { clearTimeout(statusResetTimer); statusResetTimer = null; }

    let cls = 'intercom-status';
    if (recording)    cls += ' recording';
    else if (isError) cls += ' error';
    else if (text)    cls += ' success';

    bar.textContent = text || 'BEREIT';
    bar.className = cls;

    if (!sticky && text) {
      statusResetTimer = setTimeout(() => {
        bar.textContent = 'BEREIT';
        bar.className = 'intercom-status';
      }, 3000);
    }
  }

  // ===== API CALL (STREAMING) =====
  // Talks to our own Vercel Edge Function, which holds the API key
  // server-side and proxies the request to Anthropic with stream:true.
  async function callAnthropic(onDelta) {
    const messages = state.messages.slice(-10).map(m => ({
      role: m.role,
      content: m.content
    }));

    const body = {
      model: state.model,
      messages: messages,
      max_tokens: 1024
    };
    if (state.systemPrompt) {
      body.system = state.systemPrompt;
    }

    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || 'API Error ' + res.status);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let full = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (!payload) continue;
        try {
          const evt = JSON.parse(payload);
          if (evt.type === 'content_block_delta' && evt.delta && evt.delta.type === 'text_delta') {
            full += evt.delta.text;
            onDelta(full);
          } else if (evt.type === 'error') {
            throw new Error(evt.error?.message || 'Stream error');
          }
        } catch(e) {
          // ignore partial / unknown events
        }
      }
    }
    return full.trim();
  }

  async function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    state.messages.push({ role: 'user', content: text });
    input.value = '';
    renderMessages();

    input.disabled = true;
    document.getElementById('sendBtn').disabled = true;

    // Create the assistant bubble up-front so streaming can paint into it.
    const container = document.getElementById('chatMessages');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg assistant';
    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = '◈ Claude';
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
    msgDiv.appendChild(label);
    msgDiv.appendChild(bubble);
    container.appendChild(msgDiv);
    scrollToBottom();

    try {
      const reply = await callAnthropic((partial) => {
        bubble.textContent = partial;
        scrollToBottom();
      });
      if (!reply) {
        bubble.textContent = '(leere Antwort)';
      }
      state.messages.push({ role: 'assistant', content: reply });
      saveState();
    } catch(err) {
      msgDiv.remove();
      setStatus('Fehler: ' + (err.message || 'Unbekannt'), { isError: true });
    }

    input.disabled = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }

  // ===== KEYBOARD =====
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const active = document.activeElement;
      if (active && active.id === 'chatInput') {
        e.preventDefault();
        sendMessage();
      }
    }
  });

  // Desktop scroll-wheel fallback (local browser testing)
  document.addEventListener('wheel', (e) => {
    const chatMsgs = document.getElementById('chatMessages');
    const settingsScroll = document.getElementById('settingsScroll');

    if (document.getElementById('chatScreen').classList.contains('active')) {
      chatMsgs.scrollTop += e.deltaY > 0 ? 30 : -30;
    } else if (document.getElementById('settingsScreen').classList.contains('active')) {
      settingsScroll.scrollTop += e.deltaY > 0 ? 30 : -30;
    }
  }, { passive: true });

  // ===== R1 HARDWARE EVENTS =====
  function scrollActiveScreen(delta) {
    if (document.getElementById('chatScreen').classList.contains('active')) {
      document.getElementById('chatMessages').scrollTop += delta;
    } else if (document.getElementById('settingsScreen').classList.contains('active')) {
      document.getElementById('settingsScroll').scrollTop += delta;
    }
  }
  window.addEventListener('scrollUp',   () => scrollActiveScreen(-30));
  window.addEventListener('scrollDown', () => scrollActiveScreen(30));

  // PTT short click -> toggle between chat and settings
  window.addEventListener('sideClick', () => {
    if (document.getElementById('chatScreen').classList.contains('active')) {
      showSettings();
    } else if (document.getElementById('settingsScreen').classList.contains('active')) {
      showChat();
    }
  });

  // ===== VOICE INPUT (MediaRecorder + Groq Whisper) =====
  // The R1 webview has no soft keyboard and no working
  // webkitSpeechRecognition, so we run our own STT pipeline:
  //   tap mic -> getUserMedia -> MediaRecorder -> POST to /api/transcribe
  //   -> server forwards to Groq Whisper -> JSON {text} -> sendMessage().
  //
  // Tap-to-toggle (not press-and-hold) because the R1's PTT hardware
  // button holds the mic itself and would collide with getUserMedia.
  let mediaStream = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;

  function setMicRecording(on) {
    const btn = document.getElementById('micBtn');
    if (!btn) return;
    btn.classList.toggle('recording', !!on);
  }

  function pickMimeType() {
    const candidates = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/ogg;codecs=opus',
      'audio/ogg',
      'audio/mp4'
    ];
    if (typeof MediaRecorder === 'undefined') return '';
    for (const t of candidates) {
      if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) {
        return t;
      }
    }
    return '';
  }

  async function startRecording() {
    if (isRecording) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('Mikrofon n/a', { isError: true });
      return;
    }
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      setStatus('Mic verweigert', { isError: true });
      return;
    }

    const mimeType = pickMimeType();
    try {
      mediaRecorder = mimeType
        ? new MediaRecorder(mediaStream, { mimeType })
        : new MediaRecorder(mediaStream);
    } catch (e) {
      stopMicStream();
      setStatus('Recorder-Fehler', { isError: true });
      return;
    }

    audioChunks = [];
    mediaRecorder.ondataavailable = (ev) => {
      if (ev.data && ev.data.size > 0) audioChunks.push(ev.data);
    };
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, {
        type: mediaRecorder.mimeType || 'audio/webm'
      });
      stopMicStream();
      transcribeAndSend(blob);
    };

    mediaRecorder.start();
    isRecording = true;
    setMicRecording(true);
    setStatus('REC · nochmal TALK zum Stoppen', { sticky: true, recording: true });
  }

  function stopRecording() {
    if (!isRecording) return;
    isRecording = false;
    setMicRecording(false);
    setStatus('TRANSKRIBIERE...', { sticky: true });
    try {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    } catch (e) {
      stopMicStream();
      setStatus('Stop-Fehler', { isError: true });
    }
  }

  function stopMicStream() {
    if (mediaStream) {
      try { mediaStream.getTracks().forEach(t => t.stop()); } catch(e) {}
      mediaStream = null;
    }
  }

  function toggleRecording() {
    if (isRecording) stopRecording();
    else startRecording();
  }

  async function transcribeAndSend(blob) {
    if (!blob || blob.size === 0) {
      setStatus('Leere Aufnahme', { isError: true });
      return;
    }
    try {
      const form = new FormData();
      form.append('file', blob, 'audio.webm');
      form.append('language', 'de');

      const res = await fetch('/api/transcribe', {
        method: 'POST',
        body: form
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || 'Transcribe ' + res.status);
      }
      const data = await res.json();
      const text = (data.text || '').trim();
      if (!text) {
        setStatus('Nichts verstanden', { isError: true });
        return;
      }
      const input = document.getElementById('chatInput');
      input.value = text;
      setStatus('');
      sendMessage();
    } catch (e) {
      setStatus('STT-Fehler', { isError: true });
    }
  }

  // ===== INIT =====
  (async () => {
    await loadState();
    showChat();
  })();
</script>

</body>
</html>
