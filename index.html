<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Chat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg: #1a1a1a;
    --surface: #242424;
    --surface2: #2e2e2e;
    --accent: #d4a574;
    --text: #e8e8e8;
    --text-dim: #888;
    --text-dark: #555;
    --user-bubble: #333;
    --radius: 8px;
  }

  html, body {
    width: 240px;
    height: 282px;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    line-height: 1.3;
  }

  /* ===== SCREENS ===== */
  .screen {
    display: none;
    width: 240px;
    height: 282px;
    flex-direction: column;
    position: absolute;
    top: 0;
    left: 0;
  }
  .screen.active {
    display: flex;
  }

  /* ===== HEADER ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--surface2);
    min-height: 28px;
    flex-shrink: 0;
  }
  .header-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .header-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 14px;
    padding: 2px 4px;
    cursor: pointer;
  }
  .header-btn:active {
    color: var(--text);
  }

  /* ===== MODEL INDICATOR ===== */
  .model-indicator {
    font-size: 8px;
    padding: 1px 5px;
    border-radius: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
    background: var(--accent);
    color: #000;
  }

  /* ===== CHAT SCREEN ===== */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .chat-messages::-webkit-scrollbar {
    width: 2px;
  }
  .chat-messages::-webkit-scrollbar-thumb {
    background: var(--surface2);
    border-radius: 2px;
  }

  .msg {
    margin-bottom: 6px;
    max-width: 95%;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    margin-left: auto;
  }
  .msg-bubble {
    padding: 5px 7px;
    border-radius: var(--radius);
    font-size: 9px;
    line-height: 1.35;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg.user .msg-bubble {
    background: var(--user-bubble);
    border-bottom-right-radius: 2px;
  }
  .msg.assistant .msg-bubble {
    background: var(--surface);
    border-bottom-left-radius: 2px;
    border-left: 2px solid var(--accent);
  }

  .msg-label {
    font-size: 7px;
    color: var(--text-dark);
    margin-bottom: 1px;
    padding: 0 2px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .msg.user .msg-label {
    text-align: right;
  }

  .typing-indicator {
    display: inline-flex;
    gap: 3px;
    padding: 6px 10px;
  }
  .typing-dot {
    width: 4px;
    height: 4px;
    background: var(--text-dim);
    border-radius: 50%;
    animation: typingBounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-4px); }
  }

  /* ===== INPUT BAR ===== */
  .input-bar {
    display: flex;
    padding: 4px;
    background: var(--surface);
    border-top: 1px solid var(--surface2);
    gap: 3px;
    flex-shrink: 0;
  }
  .input-bar input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--surface2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: inherit;
    font-size: 9px;
    padding: 5px 6px;
    outline: none;
  }
  .input-bar input:focus {
    border-color: var(--accent);
  }
  .send-btn {
    background: var(--accent);
    border: none;
    color: #000;
    font-family: inherit;
    font-weight: 700;
    font-size: 12px;
    width: 30px;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .send-btn:active {
    opacity: 0.7;
  }
  .send-btn:disabled {
    opacity: 0.3;
  }
  .mic-btn {
    background: var(--surface2);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: inherit;
    font-size: 11px;
    width: 30px;
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .mic-btn:active {
    background: var(--accent);
    color: #000;
  }
  .mic-btn.recording {
    background: var(--accent);
    color: #000;
    animation: micPulse 1s infinite;
  }
  @keyframes micPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.55; }
  }

  /* ===== SETTINGS SCREEN ===== */
  .settings-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .settings-scroll::-webkit-scrollbar {
    width: 2px;
  }
  .settings-scroll::-webkit-scrollbar-thumb {
    background: var(--surface2);
    border-radius: 2px;
  }

  .settings-group {
    margin-bottom: 10px;
  }
  .settings-label {
    font-size: 7px;
    color: var(--text-dark);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
    font-weight: 700;
  }
  .settings-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--surface2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: inherit;
    font-size: 9px;
    padding: 6px;
    outline: none;
  }
  .settings-input:focus {
    border-color: var(--accent);
  }

  .model-name-select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--surface2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: inherit;
    font-size: 9px;
    padding: 6px;
    outline: none;
    -webkit-appearance: none;
  }

  .save-btn {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    margin-top: 6px;
    background: var(--accent);
    color: #000;
  }
  .save-btn:active {
    opacity: 0.7;
  }

  .clear-btn {
    width: 100%;
    padding: 8px;
    border: 1px solid #aa3333;
    border-radius: var(--radius);
    background: transparent;
    color: #aa3333;
    font-family: inherit;
    font-size: 9px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  .clear-btn:active {
    background: #aa3333;
    color: #fff;
  }

  /* ===== STATUS BAR ===== */
  .status-msg {
    font-size: 7px;
    color: var(--text-dark);
    text-align: center;
    padding: 2px;
    background: var(--surface);
    flex-shrink: 0;
  }
  .status-msg.error {
    color: #cc4444;
  }
  .status-msg.success {
    color: var(--accent);
  }

  /* ===== SYSTEM PROMPT ===== */
  .settings-textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--surface2);
    border-radius: var(--radius);
    color: var(--text);
    font-family: inherit;
    font-size: 9px;
    padding: 6px;
    outline: none;
    resize: none;
    height: 40px;
  }
  .settings-textarea:focus {
    border-color: var(--accent);
  }
</style>
</head>
<body>

<!-- ===== SETTINGS SCREEN ===== -->
<div id="settingsScreen" class="screen">
  <div class="header">
    <button class="header-btn" onclick="showChat()" title="Zurück">◂</button>
    <span class="header-title">SETTINGS</span>
    <span style="width:20px"></span>
  </div>
  <div class="settings-scroll" id="settingsScroll">

    <div class="settings-group">
      <div class="settings-label">Modell</div>
      <select class="model-name-select" id="modelSelect"></select>
    </div>

    <div class="settings-group">
      <div class="settings-label">System Prompt (optional)</div>
      <textarea class="settings-textarea" id="systemPrompt" placeholder="z.B. Du bist ein hilfreicher Assistent..."></textarea>
    </div>

    <button class="save-btn" id="saveBtn" onclick="saveSettings()">💾 SPEICHERN</button>
    <button class="clear-btn" onclick="clearHistory()">🗑 Chat löschen</button>
  </div>
</div>

<!-- ===== CHAT SCREEN ===== -->
<div id="chatScreen" class="screen active">
  <div class="header">
    <button class="header-btn" onclick="showSettings()" title="Settings">⚙</button>
    <span class="header-title">AI CHAT</span>
    <span class="model-indicator" id="chatModelBadge">Claude</span>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="status-msg" id="statusBar"></div>
  <div class="input-bar">
    <button class="mic-btn" id="micBtn" onclick="requestVoiceInput()" title="Sprechen (oder PTT halten)">🎤</button>
    <input type="text" id="chatInput" placeholder="🎤 oder PTT halten" autocomplete="off">
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">▶</button>
  </div>
</div>

<script>
  // ===== STATE =====
  // The API key no longer lives in state — it's held server-side by the
  // Vercel Edge Function in api/chat.js (ANTHROPIC_API_KEY env var).
  let state = {
    model: 'claude-sonnet-4-6',
    systemPrompt: '',
    messages: []
  };

  const STORAGE_KEY = 'r1_ai_chat';

  const MODELS = [
    { id: 'claude-haiku-4-5-20251001', name: 'Haiku 4.5' },
    { id: 'claude-sonnet-4-6',          name: 'Sonnet 4.6' },
    { id: 'claude-opus-4-6',            name: 'Opus 4.6' }
  ];

  // ===== STORAGE =====
  // Prefer window.creationStorage.plain on the R1 (survives Creation updates),
  // fall back to localStorage for regular browser testing.
  function hasCreationStorage() {
    return typeof window !== 'undefined'
      && window.creationStorage
      && window.creationStorage.plain;
  }

  async function loadState() {
    try {
      let raw = null;
      if (hasCreationStorage()) {
        const stored = await window.creationStorage.plain.getItem(STORAGE_KEY);
        if (stored) {
          try { raw = atob(stored); } catch(e) { raw = stored; }
        }
      } else {
        raw = localStorage.getItem(STORAGE_KEY);
      }
      if (!raw) return;

      const parsed = JSON.parse(raw);

      // Strip legacy fields: multi-provider, client-side API keys,
      // setup flags — nothing of that lives client-side anymore.
      delete parsed.anthropicKey;
      delete parsed.openaiKey;
      delete parsed.apiKey;
      delete parsed.provider;
      delete parsed.setupDone;

      // Strip legacy per-message provider tag
      if (Array.isArray(parsed.messages)) {
        parsed.messages = parsed.messages.map(m => ({
          role: m.role,
          content: m.content
        }));
      }

      // Coerce old/unknown model ids to default
      if (parsed.model && !MODELS.find(m => m.id === parsed.model)) {
        parsed.model = 'claude-sonnet-4-6';
      }

      state = { ...state, ...parsed };
    } catch(e) {}
  }

  async function saveState() {
    try {
      const data = JSON.stringify(state);
      if (hasCreationStorage()) {
        await window.creationStorage.plain.setItem(STORAGE_KEY, btoa(data));
      } else {
        localStorage.setItem(STORAGE_KEY, data);
      }
    } catch(e) {}
  }

  // ===== NAVIGATION =====
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function showSettings() {
    showScreen('settingsScreen');
    document.getElementById('systemPrompt').value = state.systemPrompt;
    populateModelSelect();
  }

  function showChat() {
    showScreen('chatScreen');
    updateChatUI();
    renderMessages();
    scrollToBottom();
    document.getElementById('chatInput').focus();
  }

  // ===== SETTINGS =====
  function populateModelSelect() {
    const sel = document.getElementById('modelSelect');
    sel.innerHTML = '';
    MODELS.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.name;
      sel.appendChild(opt);
    });
    sel.value = state.model;
  }

  function saveSettings() {
    state.systemPrompt = document.getElementById('systemPrompt').value.trim();
    state.model = document.getElementById('modelSelect').value;
    saveState();
    showChat();
  }

  function clearHistory() {
    if (confirm('Chat-Verlauf löschen?')) {
      state.messages = [];
      saveState();
      renderMessages();
    }
  }

  // ===== CHAT UI =====
  function updateChatUI() {
    const badge = document.getElementById('chatModelBadge');
    badge.textContent = MODELS.find(m => m.id === state.model)?.name || state.model;
  }

  function renderMessages() {
    const container = document.getElementById('chatMessages');
    container.innerHTML = '';

    if (state.messages.length === 0) {
      container.innerHTML = `
        <div style="text-align:center;padding:40px 10px;color:var(--text-dark);">
          <div style="font-size:20px;margin-bottom:6px;">💬</div>
          <div style="font-size:8px;line-height:1.4;">Schreib eine Nachricht<br>oder nutze das Scroll-Wheel</div>
        </div>`;
      return;
    }

    state.messages.forEach(msg => {
      const div = document.createElement('div');
      div.className = 'msg ' + msg.role;

      const label = document.createElement('div');
      label.className = 'msg-label';
      label.textContent = msg.role === 'user' ? 'Du' : '◈ Claude';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = msg.content;

      div.appendChild(label);
      div.appendChild(bubble);
      container.appendChild(div);
    });

    scrollToBottom();
  }

  function scrollToBottom() {
    const container = document.getElementById('chatMessages');
    container.scrollTop = container.scrollHeight;
  }

  function setStatus(text, isError = false) {
    const bar = document.getElementById('statusBar');
    bar.textContent = text;
    bar.className = 'status-msg' + (isError ? ' error' : ' success');
    if (text) setTimeout(() => { bar.textContent = ''; }, 3000);
  }

  // ===== API CALL (STREAMING) =====
  // Talks to our own Vercel Edge Function, which holds the API key
  // server-side and proxies the request to Anthropic with stream:true.
  async function callAnthropic(onDelta) {
    const messages = state.messages.slice(-10).map(m => ({
      role: m.role,
      content: m.content
    }));

    const body = {
      model: state.model,
      messages: messages,
      max_tokens: 1024
    };
    if (state.systemPrompt) {
      body.system = state.systemPrompt;
    }

    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error?.message || 'API Error ' + res.status);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let full = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (!payload) continue;
        try {
          const evt = JSON.parse(payload);
          if (evt.type === 'content_block_delta' && evt.delta && evt.delta.type === 'text_delta') {
            full += evt.delta.text;
            onDelta(full);
          } else if (evt.type === 'error') {
            throw new Error(evt.error?.message || 'Stream error');
          }
        } catch(e) {
          // ignore partial / unknown events
        }
      }
    }
    return full.trim();
  }

  async function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    state.messages.push({ role: 'user', content: text });
    input.value = '';
    renderMessages();

    input.disabled = true;
    document.getElementById('sendBtn').disabled = true;

    // Create the assistant bubble up-front so streaming can paint into it.
    const container = document.getElementById('chatMessages');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg assistant';
    const label = document.createElement('div');
    label.className = 'msg-label';
    label.textContent = '◈ Claude';
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
    msgDiv.appendChild(label);
    msgDiv.appendChild(bubble);
    container.appendChild(msgDiv);
    scrollToBottom();

    try {
      const reply = await callAnthropic((partial) => {
        bubble.textContent = partial;
        scrollToBottom();
      });
      if (!reply) {
        bubble.textContent = '(leere Antwort)';
      }
      state.messages.push({ role: 'assistant', content: reply });
      saveState();
    } catch(err) {
      msgDiv.remove();
      setStatus('Fehler: ' + (err.message || 'Unbekannt'), true);
    }

    input.disabled = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }

  // ===== KEYBOARD =====
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const active = document.activeElement;
      if (active && active.id === 'chatInput') {
        e.preventDefault();
        sendMessage();
      }
    }
  });

  // Desktop scroll-wheel fallback (local browser testing)
  document.addEventListener('wheel', (e) => {
    const chatMsgs = document.getElementById('chatMessages');
    const settingsScroll = document.getElementById('settingsScroll');

    if (document.getElementById('chatScreen').classList.contains('active')) {
      chatMsgs.scrollTop += e.deltaY > 0 ? 30 : -30;
    } else if (document.getElementById('settingsScreen').classList.contains('active')) {
      settingsScroll.scrollTop += e.deltaY > 0 ? 30 : -30;
    }
  }, { passive: true });

  // ===== R1 HARDWARE EVENTS =====
  function scrollActiveScreen(delta) {
    if (document.getElementById('chatScreen').classList.contains('active')) {
      document.getElementById('chatMessages').scrollTop += delta;
    } else if (document.getElementById('settingsScreen').classList.contains('active')) {
      document.getElementById('settingsScroll').scrollTop += delta;
    }
  }
  window.addEventListener('scrollUp',   () => scrollActiveScreen(-30));
  window.addEventListener('scrollDown', () => scrollActiveScreen(30));

  // PTT short click -> toggle between chat and settings
  window.addEventListener('sideClick', () => {
    if (document.getElementById('chatScreen').classList.contains('active')) {
      showSettings();
    } else if (document.getElementById('settingsScreen').classList.contains('active')) {
      showChat();
    }
  });

  // ===== VOICE INPUT (R1 PluginMessageHandler pattern) =====
  // The R1 webview doesn't expose a soft keyboard to HTML inputs, so we
  // delegate speech-to-text to Rabbit's own pipeline via PluginMessageHandler.
  // We ask the Rabbit LLM to return the user's next utterance verbatim as
  // JSON, then feed that transcription back into sendMessage() as if the
  // user had typed it.
  let voicePending = false;
  let voiceTimeout = null;

  function hasPluginHandler() {
    return typeof PluginMessageHandler !== 'undefined'
      && PluginMessageHandler
      && typeof PluginMessageHandler.postMessage === 'function';
  }

  function setMicRecording(on) {
    const btn = document.getElementById('micBtn');
    if (!btn) return;
    btn.classList.toggle('recording', !!on);
  }

  function resetVoicePending() {
    voicePending = false;
    if (voiceTimeout) { clearTimeout(voiceTimeout); voiceTimeout = null; }
    setMicRecording(false);
  }

  function requestVoiceInput() {
    if (voicePending) return;
    if (!hasPluginHandler()) {
      setStatus('Voice nur auf R1 - bitte PTT halten', true);
      return;
    }
    voicePending = true;
    setMicRecording(true);
    setStatus('🎤 Sprich jetzt...');

    voiceTimeout = setTimeout(() => {
      if (!voicePending) return;
      resetVoicePending();
      setStatus('Keine Eingabe erkannt', true);
    }, 20000);

    try {
      PluginMessageHandler.postMessage(JSON.stringify({
        message: 'Transcribe the user\'s next utterance verbatim. Return ONLY JSON: {"text":"..."}. Do not answer, interpret, translate, or comment.',
        useLLM: true,
        wantsR1Response: false
      }));
    } catch (e) {
      resetVoicePending();
      setStatus('Plugin-Fehler: ' + (e.message || e), true);
    }
  }

  function extractTranscription(data) {
    if (!data) return '';
    // Primary: data.data is a JSON string or object
    if (data.data != null) {
      let parsed = data.data;
      if (typeof parsed === 'string') {
        try { parsed = JSON.parse(parsed); }
        catch(e) { return parsed.trim(); }
      }
      if (parsed && typeof parsed === 'object') {
        return (parsed.text || parsed.answer || parsed.transcription || '').toString().trim();
      }
    }
    // Fallback: data.message is plain text
    if (typeof data.message === 'string') {
      return data.message.trim();
    }
    return '';
  }

  window.onPluginMessage = function(data) {
    if (!voicePending) return;
    resetVoicePending();

    const text = extractTranscription(data);
    if (!text) {
      setStatus('Keine Eingabe erkannt', true);
      return;
    }

    const input = document.getElementById('chatInput');
    input.value = text;
    sendMessage();
  };

  // PTT long-press also triggers voice input — hold to speak.
  window.addEventListener('longPressStart', () => {
    if (document.getElementById('chatScreen').classList.contains('active')) {
      requestVoiceInput();
    }
  });

  // ===== INIT =====
  (async () => {
    await loadState();
    showChat();
  })();
</script>

</body>
</html>
